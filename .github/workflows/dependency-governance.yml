name: Dependency governance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-governance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  graph-and-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Regression tests for structured license report
        run: python scripts/test_license_report.py
      - name: Collect locked four-target graphs and npm inventory
        run: python scripts/dependency_inventory.py --output "$RUNNER_TEMP/dependency-evidence"
      - name: Install checksum-verified cargo-about 0.9.3
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-about@0.9.3
          checksum: true
          fallback: none
      - name: Generate third-party notice candidate (strict harvesting)
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dependency-evidence"
          scratch="$RUNNER_TEMP/notice-checkout"
          mkdir "$scratch"
          git archive HEAD | tar -x -C "$scratch"
          python scripts/prepare_notice_inventory.py --checkout "$scratch"
          cargo about generate --locked --fail --format json --manifest-path "$scratch/src-tauri/Cargo.toml" --config "$scratch/src-tauri/about.toml" --output-file "$output/cargo-about.json" 2>&1 | tee "$output/cargo-about.log"
          test -s "$output/cargo-about.json"
          cmp src-tauri/Cargo.lock "$scratch/src-tauri/Cargo.lock"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked npm runtime dependencies without scripts
        run: npm ci --omit=dev --ignore-scripts
      - name: Stage reviewed Rust notices and exact MPL source archives
        run: python scripts/stage_license_notices.py --evidence "$RUNNER_TEMP/dependency-evidence"
      - name: Verify production manifests and lockfiles unchanged
        if: always()
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
      - name: Upload graph and notice review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-governance-evidence
          path: ${{ runner.temp }}/dependency-evidence/
          if-no-files-found: error
  license-policy-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install checksum-verified cargo-deny 0.22.1
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1
          checksum: true
          fallback: none
      - name: Evaluate exact-version SPDX policy (unapproved terms fail)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/license-policy"
          cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml --locked check licenses 2>&1 | tee "$RUNNER_TEMP/license-policy/cargo-deny.log"
      - name: Verify production manifests and lockfiles unchanged
        if: always()
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
      - name: Preserve SPDX policy evidence even on rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-policy-review
          path: ${{ runner.temp }}/license-policy/
          if-no-files-found: warn
  package-notice-smoke:
    needs: [graph-and-notices, license-policy-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: actions/download-artifact@v4
        with:
          name: dependency-governance-evidence
          path: ${{ runner.temp }}/dependency-evidence
      - name: Prepare resource overlay without changing production configuration
        run: python scripts/verify_license_bundle.py --resources "$RUNNER_TEMP/dependency-evidence/bundle-resources"
      - name: Build unsigned DEB for local verification only
        run: |
          npm ci
          npm run tauri -- build --config src-tauri/tauri.license-review.generated.json --bundles deb -- --locked
      - name: Extract DEB and verify every staged license/source byte
        run: |
          set -euo pipefail
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f)
          test "${#packages[@]}" -eq 1
          python scripts/verify_license_bundle.py --resources "$RUNNER_TEMP/dependency-evidence/bundle-resources" --deb "${packages[0]}"
      - name: Verify production files unchanged
        if: always()
        run: git diff --exit-code -- src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
