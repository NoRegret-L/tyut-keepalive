name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    uses: ./.github/workflows/platform-checks.yml
    with:
      os: ${{ matrix.os }}

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate release trust configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python scripts/check_security.py --release
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            test "$draft" = true || { echo "Release already published; refusing to modify it"; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --title "TYUT Keepalive $TAG" --notes "Windows / macOS / Linux desktop release"
          fi

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # All jobs update the same draft latest.json. Avoid concurrent writes.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: --bundles msi
          - platform: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: ubuntu-latest
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Reuse verified dependencies only; never save signed build outputs or tools.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: platform-release
          cache-bin: false
          save-if: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install frontend dependencies
        run: npm ci
      - name: Enable signed update artifacts for this release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python scripts/check_security.py --enable-bundling

      - name: Check frontend HTML
        run: npm run check:html

      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TYUT Keepalive v__VERSION__（Windows / macOS / Linux）'
          releaseBody: 'Tauri 2 三平台桌面版：开机自启、后台静默驻留托盘、单实例、响应式界面。按对应平台下载资产。'
          releaseAssetNamePattern: 'TYUT-Keepalive-v[version]-[platform]-[arch][ext]'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: ${{ matrix.args }} -- --locked

  validate_draft:
    needs: release
    runs-on: ubuntu-latest
    # GitHub draft releases are visible only to identities with push access.
    # This job reads draft assets and never publishes the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check complete updater manifest before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          gh release download "$TAG" --pattern latest.json --output "$RUNNER_TEMP/latest.json"
          gh release view "$TAG" --json assets --jq '.assets' > "$RUNNER_TEMP/release-assets.json"
          python scripts/check_update_manifest.py "$RUNNER_TEMP/latest.json" "$TAG" "$RUNNER_TEMP/release-assets.json"
      # Never publish on a tag push. Maintainers must accept the exact signed draft.
      - name: Record manual release acceptance checklist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Signed draft validated: $TAG"
            echo "The release is still a draft. Do not publish until all acceptance checks pass."
            echo "- [ ] Verify the three-platform CI and review dependency and license evidence."
            echo "- [ ] Test the exact signed draft installers on Windows, macOS (Intel and Apple Silicon), and Linux."
            echo "- [ ] Verify campus login, network recovery, sleep/wake, credential migration and removal."
            echo "- [ ] Verify updater signatures and supported upgrade paths; review macOS signing/notarization."
            echo "- [ ] Confirm the tag, commit and release assets are unchanged since validation."
            echo "After acceptance, a maintainer may explicitly publish the draft from the Releases page."
          } >> "$GITHUB_STEP_SUMMARY"
