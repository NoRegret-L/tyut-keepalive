name: Development CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'develop/v*']
  workflow_dispatch:
permissions:
  contents: read
# Superseded PR revisions need not consume runners. Main/push/manual runs stay independent.
concurrency:
  group: development-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    uses: ./.github/workflows/platform-checks.yml
    with:
      os: ${{ matrix.os }}
